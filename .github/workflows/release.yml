name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -c release

      - name: Verify build
        run: |
          echo "Build completed successfully!"
          ls -la .build/release/
          .build/release/caliper --version || echo "Version command not available"

      # The HTML template and the vendored d3 live in this bundle. Without it beside the
      # binary, report generation dies — and it used to die silently here, because a
      # release asset cannot be a directory. Every release from 1.3.3 onwards shipped the
      # executable alone.
      - name: Package the resource bundle
        run: |
          set -euo pipefail
          cd .build/release
          test -d caliper_CaliperCore.bundle || {
            echo "::error::caliper_CaliperCore.bundle was not produced by the build"
            exit 1
          }
          tar -czf caliper_CaliperCore.bundle.tar.gz caliper_CaliperCore.bundle
          test -s caliper_CaliperCore.bundle.tar.gz || {
            echo "::error::the packaged resource bundle is empty"
            exit 1
          }
          # Contents, not just size: an archive that carries the directory but not the
          # vendored d3 would satisfy every other check here.
          tar -tzf caliper_CaliperCore.bundle.tar.gz | grep -q "d3.v7.min.js" || {
            echo "::error::the packaged bundle does not contain d3.v7.min.js"
            tar -tzf caliper_CaliperCore.bundle.tar.gz
            exit 1
          }
          ls -la caliper_CaliperCore.bundle.tar.gz

      # Runs the packaged artifact the way a user would: two files downloaded, bundle
      # extracted, HTML report written. This is the check whose absence let the original
      # release fix through — a directory listed as a release asset is silently skipped,
      # so nothing failed and a broken binary shipped from 1.3.3 onwards.
      #
      # The mirror-image check — that it fails *without* the bundle — cannot be made here.
      # SwiftPM bakes the bundle's absolute build path into the binary, and on a build
      # machine that path exists, so the binary always finds the bundle regardless. That
      # was verified by hand with the build tree removed.
      - name: Verify the packaged artifact can generate a report
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/Payload/App.app"
          head -c 4096 /dev/urandom > "$workdir/Payload/App.app/App"
          printf '<?xml version="1.0"?><plist version="1.0"><dict/></plist>' \
            > "$workdir/Payload/App.app/Info.plist"
          (cd "$workdir" && zip -qr app.ipa Payload)

          # Exactly what a release download looks like: two files, nothing else.
          cp .build/release/caliper "$workdir/"
          cp .build/release/caliper_CaliperCore.bundle.tar.gz "$workdir/"
          cd "$workdir"

          tar -xzf caliper_CaliperCore.bundle.tar.gz
          ./caliper --ipa-path app.ipa --output-dir out
          test -s out/report.json || { echo "::error::no JSON report produced"; exit 1; }
          test -s out/report.html || { echo "::error::no HTML report produced"; exit 1; }
          grep -q "d3.v7" out/report.html || {
            echo "::error::the HTML report has no d3 inlined"
            exit 1
          }
          echo "Packaged artifact verified: $(ls -la out/report.html)"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Caliper ${{ steps.version.outputs.VERSION }}

            ### Installation

            Download both assets, then unpack the resource bundle next to the executable.
            The HTML report template and the vendored d3 live inside it, so `caliper`
            cannot write an HTML report without it:

            ```bash
            # 1. download `caliper` and `caliper_CaliperCore.bundle.tar.gz`
            # 2. put both in the same directory
            tar -xzf caliper_CaliperCore.bundle.tar.gz
            chmod +x caliper
            ./caliper --ipa-path MyApp.ipa
            ```

            Keeping them together matters — the bundle is looked up beside the executable.
            The JSON report is written either way, so a missing bundle shows up as a
            missing HTML report rather than a crash.

            **Manual build:**
            ```bash
            git clone https://github.com/kibotu/caliper.git
            cd caliper
            git checkout ${{ steps.version.outputs.VERSION }}
            swift build -c release
            .build/release/caliper --ipa-path MyApp.ipa
            ```

            ### Changes
            See commit history for details.
          files: |
            .build/release/caliper
            .build/release/caliper_CaliperCore.bundle.tar.gz
          draft: false
          prerelease: false

